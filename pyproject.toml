[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nupstudio"
version = "0.5.0"
description = "Cross-platform NUP package editor"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.7",
    "zstandard>=0.22",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.11"]

[project.scripts]
nupstudio = "nupstudio.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
